<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman - Unbanned Cave</title>
    <style>
        /* Reset margins and paddings */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* Container scales to 100% of the viewport */
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Force Ruffle player element to expand */
        #game-container ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Load the official Ruffle package from CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container"></div>

    <script>
        // Global Ruffle configuration
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "letterbox": "fullscreen", // Scales content to fit screen dimensions
            "autoplay": "on",          // Attempts to play right away
            "unmuteOverlay": "hidden"  // Hides the initial "click to unmute" overlay
        };

        // Initialize and load the SWF file
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("game-container");
            
            container.appendChild(player);
            
            // REPLACE with the path or URL to your actual SWF file
            player.load("https://raw.githubusercontent.com/BulbasaurChat/bulbasaurchat.github.io/refs/heads/main/flash/Pacman.swf"); 
        });
    </script>

</body>
</html>
